<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABRIZAQ</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #f1f5f9; color: #0f172a; }
    .topbar { background: #1d4ed8; color: #fff; padding: 14px; border-radius: 10px; margin-bottom: 14px; }
    .topbar h1 { margin: 0; font-size: 22px; }
    .card { background: #fff; padding: 14px; border-radius: 10px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    input, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 7px; border: 1px solid #cbd5e1; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    #statusMsg { margin-top: 8px; font-weight: bold; font-size: 13px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>ABRIZAQ</h1>
  </div>

  <div class="card">
    <h2>Blue Verification (ABRIZAQ)</h2>
    <input type="text" id="vendorName" placeholder="Magaca Dukaanka / Ganacsadaha (tabta Vendors)" />
    <button onclick="sendBlueVerification()">Blue Verify</button>
    <p id="statusMsg"></p>
  </div>

  <script>
    const MAKE_WEBHOOK_URL = "https://hook.eu1.make.com/dsz4f8zjco55vtcxrna7shipr6p1erog"; // Ku beddel Webhook URL-ka Make.com (3698015)

    async function sendBlueVerification() {
      const nameInput = document.getElementById("vendorName");
      const statusEl = document.getElementById("statusMsg");
      const vendorName = nameInput.value.trim();

      if (!vendorName) {
        statusEl.textContent = "Fadlan qor magaca dukaanka / ganacsadaha.";
        return;
      }

      statusEl.textContent = "Waa la dirayaa codsiga Blue Verification...";

      try {
        const response = await fetch(MAKE_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            app: "ABRIZAQ",
            scenario_id: 3698015,
            database: "Abrisac_Database",
            sheet: "Vendors",
            column: "I",
            field: "blue_verified",
            vendor_name: vendorName,
            blue_verified: true
          })
        });

        if (response.ok) {
          statusEl.textContent = "Blue Verification waa la diray (" + vendorName + ").";
        } else {
          statusEl.textContent = "Khalad ayaa dhacay (" + response.status + ").";
        }
      } catch (error) {
        statusEl.textContent = "Xiriirka ayaa go'ay: " + error.message;
      }
    }
  </script>
</body>
</html>
